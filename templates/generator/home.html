<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navkar Arts - Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .card {
            margin-bottom: 1.5rem;
        }
        .sticky-bottom-container {
            position: sticky;
            bottom: 0;
            background: white;
            padding: 1rem;
            border-top: 1px solid #dee2e6;
            z-index: 1020;
        }
        .table-responsive {
            max-height: 500px;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="text-center mb-4">
        <h1 class="fw-bold">Navkar Arts</h1>
        <p class="lead">Quotation & Job Card Generator</p>
    </div>

    <form action="{% url 'generator:home' %}" method="post" enctype="multipart/form-data" id="main-form">
        {% csrf_token %}

        <!-- Client & Project Details -->
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">Client & Project Details</h5>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="client_name" class="form-label">Client Name</label>
                        <input type="text" class="form-control form-control-sm" id="client_name" name="client_name" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="client_phone" class="form-label">Phone Number</label>
                        <input type="tel" class="form-control form-control-sm" id="client_phone" name="client_phone" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="client_address" class="form-label">Client Address</label>
                        <input type="text" class="form-control form-control-sm" id="client_address" name="client_address" required>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-8 mb-3">
                        <label for="site_address" class="form-label">Site Address</label>
                        <input type="text" class="form-control form-control-sm" id="site_address" name="site_address" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="date" class="form-label">Date</label>
                        <input type="date" class="form-control form-control-sm" id="date" name="date" value="{{ date|date:'Y-m-d' }}" readonly>
                    </div>
                </div>
            </div>
        </div>

        <!-- Quotation Items -->
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Quotation Items</h5>
                <button type="button" class="btn btn-primary btn-sm" id="add-quotation-row">Add Row</button>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-bordered table-sm" id="quotation-table">
                        <thead class="table-light">
                            <tr>
                                <th style="width: 40%;">Description</th>
                                <th style="width: 10%;">Qty</th>
                                <th style="width: 15%;">Rate</th>
                                <th style="width: 10%;">Discount (%)</th>
                                <th style="width: 15%;">Final Amount</th>
                                <th style="width: 10%;">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Dynamic rows will be inserted here -->
                        </tbody>
                        <tfoot>
                            <tr>
                                <th colspan="4" class="text-end">Total:</th>
                                <th id="quotation-total">0.00</th>
                                <th></th>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>
        </div>

        <!-- Job Card Items -->
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Job Card Items</h5>
                <button type="button" class="btn btn-primary btn-sm" id="add-job-card-row">Add Row</button>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-bordered table-sm" id="job-card-table">
                        <thead class="table-light">
                            <tr>
                                <th>Company Name</th>
                                <th>Booklet No</th>
                                <th>Page No</th>
                                <th>Reference Image</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Dynamic rows will be inserted here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Sticky Generate Button -->
        <div class="sticky-bottom-container text-center">
            <button type="submit" class="btn btn-success btn-lg">Generate PDFs</button>
        </div>
    </form>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    // Set today's date
    const dateInput = document.getElementById('date');
    if (!dateInput.value) {
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        dateInput.value = `${yyyy}-${mm}-${dd}`;
    }

    // --- Quotation Logic ---
    const quotationTableBody = document.querySelector('#quotation-table tbody');
    const addQuotationRowBtn = document.getElementById('add-quotation-row');
    const quotationTotalEl = document.getElementById('quotation-total');

    let quotationRowCount = 0;

    function addQuotationRow() {
        quotationRowCount++;
        const row = document.createElement('tr');
        row.innerHTML = `
            <td><input type="text" class="form-control form-control-sm" name="quotation_description[]"></td>
            <td><input type="number" class="form-control form-control-sm qty" name="quotation_qty[]" value="1" step="0.01"></td>
            <td><input type="number" class="form-control form-control-sm rate" name="quotation_rate[]" value="0" step="0.01"></td>
            <td><input type="number" class="form-control form-control-sm discount" name="quotation_discount_percent[]" value="0" step="0.01"></td>
            <td class="final-amount">0.00</td>
            <td><button type="button" class="btn btn-danger btn-sm delete-row">Delete</button></td>
        `;
        quotationTableBody.appendChild(row);
    }

    function updateQuotationTotals() {
        let total = 0;
        quotationTableBody.querySelectorAll('tr').forEach(row => {
            const qty = parseFloat(row.querySelector('.qty').value) || 0;
            const rate = parseFloat(row.querySelector('.rate').value) || 0;
            const discount = parseFloat(row.querySelector('.discount').value) || 0;

            const rowTotal = qty * rate;
            const discountAmount = rowTotal * (discount / 100);
            const finalAmount = rowTotal - discountAmount;

            row.querySelector('.final-amount').textContent = finalAmount.toFixed(2);
            total += finalAmount;
        });
        quotationTotalEl.textContent = total.toFixed(2);
    }

    addQuotationRowBtn.addEventListener('click', addQuotationRow);

    quotationTableBody.addEventListener('input', function(e) {
        if (e.target.classList.contains('qty') || e.target.classList.contains('rate') || e.target.classList.contains('discount')) {
            updateQuotationTotals();
        }
    });

    quotationTableBody.addEventListener('click', function(e) {
        if (e.target.classList.contains('delete-row')) {
            e.target.closest('tr').remove();
            updateQuotationTotals();
        }
    });

    // --- Job Card Logic ---
    const jobCardTableBody = document.querySelector('#job-card-table tbody');
    const addJobCardRowBtn = document.getElementById('add-job-card-row');
    let jobCardRowCount = 0;

    function addJobCardRow() {
        const index = jobCardRowCount++; // Use a unique incrementing index
        const row = document.createElement('tr');
        row.innerHTML = `
            <td><input type="text" class="form-control form-control-sm" name="job_card_company_name_${index}"></td>
            <td><input type="text" class="form-control form-control-sm" name="job_card_booklet_no_${index}"></td>
            <td><input type="text" class="form-control form-control-sm" name="job_card_page_no_${index}"></td>
            <td><input type="file" class="form-control form-control-sm" name="job_card_image_${index}" accept="image/*"></td>
            <td><button type="button" class="btn btn-danger btn-sm delete-row">Delete</button></td>
        `;
        jobCardTableBody.appendChild(row);
    }

    addJobCardRowBtn.addEventListener('click', addJobCardRow);

    jobCardTableBody.addEventListener('click', function(e) {
        if (e.target.classList.contains('delete-row')) {
            e.target.closest('tr').remove();
        }
    });

    // Add initial rows
    addQuotationRow();
    addJobCardRow();
});
</script>

</body>
</html>
