<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navkar Arts - Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .card {
            margin-bottom: 1.5rem;
        }
        .sticky-bottom-container {
            position: sticky;
            bottom: 0;
            background: white;
            padding: 1rem;
            border-top: 1px solid #dee2e6;
            z-index: 1020;
        }
        .table-responsive {
            max-height: 500px;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="fw-bold mb-0">Navkar Arts</h1>
            <p class="lead mb-0">Quotation & Job Card Generator</p>
        </div>
        <a href="{% url 'generator:project_list' %}" class="btn btn-outline-info">
            <i class="bi bi-list-ul me-2"></i>View All Projects
        </a>
    </div>

    <form action="{% url 'generator:home' %}" method="post" enctype="multipart/form-data" id="main-form">
        {% csrf_token %}

        <!-- Client & Project Details -->
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">Client & Project Details</h5>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="client_name" class="form-label">Client Name</label>
                        <input type="text" class="form-control form-control-sm" id="client_name" name="client_name" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="client_phone" class="form-label">Phone Number</label>
                        <input type="tel" class="form-control form-control-sm" id="client_phone" name="client_phone" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="client_address" class="form-label">Client Address</label>
                        <input type="text" class="form-control form-control-sm" id="client_address" name="client_address" required>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-8 mb-3">
                        <label for="site_address" class="form-label">Site Address</label>
                        <input type="text" class="form-control form-control-sm" id="site_address" name="site_address" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="date" class="form-label">Date</label>
                        <input type="date" class="form-control form-control-sm" id="date" name="date" value="{{ date|date:'Y-m-d' }}" readonly>
                    </div>
                </div>
            </div>
        </div>

        <!-- Items -->
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Project Items</h5>
                <button type="button" class="btn btn-primary btn-sm" id="add-item-row">Add Row</button>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-bordered table-sm" id="item-table">
                        <thead class="table-light">
                            <tr>
                                <th style="min-width: 200px;">Description</th>
                                <th style="min-width: 80px;">Height</th>
                                <th style="min-width: 80px;">Width</th>
                                <th style="min-width: 80px;">Fold</th>
                                <th style="min-width: 80px;">Meter</th>
                                <th style="min-width: 80px;">Part</th>
                                <th style="min-width: 80px;">Qty</th>
                                <th style="min-width: 100px;">Rate</th>
                                <th style="min-width: 100px;">Discount (%)</th>
                                <th style="min-width: 100px;">Final Amount</th>
                                <th style="min-width: 150px;">Company Name</th>
                                <th style="min-width: 100px;">Booklet No</th>
                                <th style="min-width: 100px;">Page No</th>
                                <th style="min-width: 200px;">Reference Image</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Dynamic rows will be inserted here -->
                        </tbody>
                        <tfoot>
                            <tr>
                                <th colspan="9" class="text-end">Total:</th>
                                <th id="quotation-total">0.00</th>
                                <th colspan="5"></th>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>
        </div>

       

        <!-- Sticky Generate Button -->
        <div class="sticky-bottom-container text-center">
            <button type="submit" class="btn btn-success btn-lg">Generate PDFs</button>
        </div>
    </form>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    // Set today's date
    const dateInput = document.getElementById('date');
    if (!dateInput.value) {
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        dateInput.value = `${yyyy}-${mm}-${dd}`;
    }

    // --- Items Logic ---
    const itemTableBody = document.querySelector('#item-table tbody');
    const addItemRowBtn = document.getElementById('add-item-row');
    const itemTotalEl = document.getElementById('quotation-total');

   function addItemRow() {
    const index = itemTableBody.children.length;

    const row = document.createElement('tr');
    row.innerHTML = `
        <td><input type="text" class="form-control form-control-sm" name="quotation_description[]"></td>
        <td><input type="number" class="form-control form-control-sm height" value="0"></td>
        <td><input type="number" class="form-control form-control-sm width" value="0"></td>
        <td><input type="number" class="form-control form-control-sm fold" value="12"></td>
        <td><input type="number" class="form-control form-control-sm meter" readonly></td>
        <td><input type="number" class="form-control form-control-sm part"></td>
        <td><input type="number" class="form-control form-control-sm qty" name="quotation_qty[]" readonly></td>
        <td><input type="number" class="form-control form-control-sm rate" name="quotation_rate[]" value="0"></td>
        <td><input type="number" class="form-control form-control-sm discount" name="quotation_discount_percent[]" value="0"></td>
        <td class="final-amount text-end">0.00</td>

        <td><input type="text" class="form-control form-control-sm" name="company_name_${index}"></td>
        <td><input type="text" class="form-control form-control-sm" name="booklet_no_${index}"></td>
        <td><input type="text" class="form-control form-control-sm" name="page_no_${index}"></td>

        <td><input type="file" name="reference_image_${index}" class="form-control form-control-sm"></td>
        <td><button type="button" class="btn btn-danger btn-sm delete-row">Delete</button></td>
    `;
    itemTableBody.appendChild(row);
}
    function updateItemTotals(recalculatePart = false) {
        let total = 0;
        itemTableBody.querySelectorAll('tr').forEach(row => { 
            const height = parseFloat(row.querySelector('.height').value) || 0;
            const width = parseFloat(row.querySelector('.width').value) || 0;
            const fold = parseFloat(row.querySelector('.fold').value) || 0;
            
            let part;
            if (recalculatePart) {
                part = Math.ceil(width / 21);
                row.querySelector('.part').value = part;
            }
            part = parseFloat(row.querySelector('.part').value) || 0;
            
            const meter = (height + fold) / 39;
            const qty = part * meter;

            row.querySelector('.meter').value = meter.toFixed(2);
            row.querySelector('.qty').value = qty.toFixed(2);

            const rate = parseFloat(row.querySelector('.rate').value) || 0;
            const discount = parseFloat(row.querySelector('.discount').value) || 0;

            const rowTotal = qty * rate;
            const discountAmount = rowTotal * (discount / 100);
            const finalAmount = rowTotal - discountAmount;

            row.querySelector('.final-amount').textContent = finalAmount.toFixed(2);
            total += finalAmount;
        });
        if (itemTotalEl) {
            itemTotalEl.textContent = total.toFixed(2);
        }
    }

    addItemRowBtn.addEventListener('click', addItemRow);

    itemTableBody.addEventListener('input', function(e) {
        const target = e.target;
        if (target.classList.contains('width')) {
            updateItemTotals(true); // Recalculate part
        } else if (target.classList.contains('height') || target.classList.contains('fold') || 
                   target.classList.contains('part') || target.classList.contains('rate') || 
                   target.classList.contains('discount')) {
            updateItemTotals(false); // Recalculate totals, but not the part
        }
    });

    itemTableBody.addEventListener('click', function(e) {
        if (e.target.classList.contains('delete-row')) {
            e.target.closest('tr').remove();
            updateItemTotals();
        }
    });

    // Add initial row
    addItemRow();
});
</script>

</body>
</html>
