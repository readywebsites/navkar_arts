<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Created - Navkar Arts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card text-center shadow-sm">
                <div class="card-header">
                    <h4 class="my-2">Project Successfully Created!</h4>
                </div>
                <div class="card-body">
                    <p class="card-text">Your Quotation and Job Card have been generated.</p>
                    
                    <div class="d-grid gap-2 col-10 mx-auto my-4">
                        <a href="{{ quotation_pdf_url }}" target="_blank" class="btn btn-primary">
                            <i class="bi bi-download me-2"></i> Download Quotation PDF
                        </a>
                        <a href="{{ job_card_pdf_url }}" target="_blank" class="btn btn-secondary">
                            <i class="bi bi-download me-2"></i> Download Job Card PDF
                        </a>
                        <a href="{{ whatsapp_url }}" target="_blank" class="btn btn-success">
                            <i class="bi bi-whatsapp me-2"></i> Send via WhatsApp
                        </a>
                    </div>

                    <hr>

                    <a href="{% url 'generator:home' %}" class="btn btn-outline-secondary mt-2">
                        <i class="bi bi-plus-circle me-2"></i> Create Another Project
                    </a>
                    <a href="{% url 'generator:project_list' %}" class="btn btn-outline-info mt-2">
                        <i class="bi bi-list me-2"></i> View All Projects
                    </a>
                </div>
                <div class="card-footer text-muted">
                    Project for: {{ project.client.name }}
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
